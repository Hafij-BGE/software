# Builds the Craft Suite .deb. On the default branch (and when run by hand, or by the upstream
# sync) it also publishes a GitHub release with the .deb and latest.txt, which is what
# craft-suite-update on installed copies looks for.
name: Build .deb

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 (glibc 2.35), like the upstream release builds, so the package installs on
    # Ubuntu 22.04+, Debian 12+, Linux Mint 21+ and the like.
    container: ubuntu:22.04
    timeout-minutes: 180
    # Steps in a container run with sh (dash) unless told otherwise; they use bash syntax.
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools and libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config python3 file xz-utils \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version counts commits; the subtree records name upstream commits
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            suite
            upstream/wordcraft
            upstream/deckcraft
            upstream/gridcraft
          shared-key: craft-suite
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          packaging/build-deb.sh --with-fonts
      - name: Smoke test
        run: |
          apt-get install -y ./dist/craft-suite_*.deb
          craft-suite --version
          wordcraft-cli --version
          deckcraft-cli --version || deckcraft-cli --help >/dev/null
          gridcraft-cli --version || gridcraft-cli --help >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-suite-deb
          path: |
            dist/*.deb
            dist/latest-*.txt
          if-no-files-found: error

      - name: Publish a release
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="$(ls dist/*.deb | head -n1)"
          version="$(awk '{ print $2; exit }' dist/latest-*.txt)"
          tag="v${version//+/-}"
          cat dist/latest-*.txt > dist/latest.txt
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          body="$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "target_commitish": sys.argv[2], "name": "Craft Suite " + sys.argv[3], "body": "Built from " + sys.argv[2][:12] + ". Install: sudo apt install ./" + sys.argv[4] + ". Installed copies update with craft-suite-update, or Check for updates on the Home page."}))' "$tag" "$GITHUB_SHA" "$version" "$(basename "$deb")")"
          id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/releases" -d "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          for f in "$deb" dist/latest.txt; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$f")" >/dev/null
          done
          echo "released $tag"
