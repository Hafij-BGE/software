# Builds Craft Suite for Linux (.deb) and Windows (installer and zip). On the default branch
# (pushed to, or run by hand there) it also publishes a GitHub release: the Linux job creates it
# with the .deb and latest.txt (what craft-suite-update on installed copies looks for), and the
# Windows job adds its files to it.
name: Build .deb

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Write access only for publishing the release; the token stays out of the checkout (the build
# runs third-party build scripts), and the release steps get it from GH_TOKEN.
permissions:
  contents: write

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 (glibc 2.35), like the upstream release builds, so the package installs on
    # Ubuntu 22.04+, Debian 12+, Linux Mint 21+ and the like.
    container: ubuntu:22.04
    timeout-minutes: 180
    # Steps in a container run with sh (dash) unless told otherwise; they use bash syntax.
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools and libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config python3 file xz-utils \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version counts commits; the subtree records name upstream commits
          persist-credentials: false
      # Markd's web version (packaging/build-markd-web.sh).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            suite
            upstream/wordcraft
            upstream/deckcraft
            upstream/gridcraft
          shared-key: craft-suite
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          packaging/build-deb.sh --with-fonts
      - name: Smoke test
        run: |
          apt-get install -y ./dist/craft-suite_*.deb
          craft-suite --version
          wordcraft-cli --version
          deckcraft-cli --version || deckcraft-cli --help >/dev/null
          gridcraft-cli --version || gridcraft-cli --help >/dev/null
          test -f /usr/share/craft-suite/markd/index.html
          test -f /usr/share/craft-suite/templates/index.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-suite-deb
          path: |
            dist/*.deb
            dist/latest-*.txt
          if-no-files-found: error

      - name: Publish a release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/latest-*.txt > dist/latest.txt
          packaging/publish-release.sh --create dist/*.deb dist/latest.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The icon and version information must make it into craft-suite.exe.
      CRAFT_SUITE_REQUIRE_WINRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            suite
            upstream/wordcraft
            upstream/deckcraft
            upstream/gridcraft
          shared-key: craft-suite-windows
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
      - name: Build the installer and zip
        run: packaging/build-windows.sh --with-fonts
      - name: Smoke test
        run: |
          dir="build/windows/Craft Suite"
          "$dir/wordcraft-cli.exe" --version
          "$dir/deckcraft-cli.exe" --version || "$dir/deckcraft-cli.exe" --help >/dev/null
          "$dir/gridcraft-cli.exe" --version || "$dir/gridcraft-cli.exe" --help >/dev/null
          test -s "$dir/craft-suite.exe"
          test -f "$dir/markd/index.html"
          test -f "$dir/templates/index.json"
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-suite-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
      - name: Add to the release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/publish-release.sh dist/*.zip dist/*-setup.exe
