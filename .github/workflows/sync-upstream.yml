# Once a day (and when run by hand): merge new commits from WordCraft, DeckCraft and GridCraft
# into upstream/ with scripts/update-upstream.sh, keeping the changes made in this repository,
# and check that the suite still compiles against them.
#
# A clean update that compiles is merged into the default branch and released (Linux, Windows,
# Android) with nothing to click. An update that conflicts with the changes made here, or doesn't
# compile, goes to the branch "upstream-sync" as a pull request instead, so nothing broken is
# released. To review every update first, set the repository variable AUTO_UPDATE to false
# (Settings › Secrets and variables › Actions › Variables): each one then comes as a pull request.
# Pull requests need Settings › Actions › General › "Allow GitHub Actions to create and approve
# pull requests".
#
# After an update, scripts/backup-deps.sh refreshes backup/ (the copies the builds fall back to
# if ArtCraft's repositories disappear). When they can't be reached at all, the sync warns and
# stops; the builds carry on from backup/.
name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Anything new?
        id: check
        run: |
          set +e
          scripts/update-upstream.sh --check
          code=$?
          set -e
          if [ "$code" = 10 ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != 0 ]; then
            # Gone or down: nothing to merge; the builds use backup/ (packaging/lib.sh).
            echo "::warning::The upstream repositories can't be reached (see upstream.conf); nothing to sync. Builds fall back to backup/."
          fi
      - name: Merge the upstream changes
        if: steps.check.outputs.new == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B upstream-sync
          if scripts/update-upstream.sh; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            # The copies of craft-libs and craft-fonts the builds fall back to, for the versions
            # the updated apps pin.
            scripts/backup-deps.sh
            git add -A backup
            git diff --cached --quiet || git commit -q -m "Refresh backup/ for the upstream update"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            # Keep the conflict markers in a commit so the pull request shows what to resolve.
            git add -A
            git -c core.editor=true commit --no-verify -m "Upstream update with merge conflicts to resolve" || true
          fi
      - name: Build libraries
        if: steps.check.outputs.new == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.check.outputs.new == 'true' && steps.merge.outputs.conflict == 'false'
        with:
          workspaces: suite
          shared-key: craft-suite-check
      - name: Does the suite still compile?
        if: steps.check.outputs.new == 'true' && steps.merge.outputs.conflict == 'false'
        id: compile
        run: |
          if (cd suite && cargo check --release) > check.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          tail -n 60 check.log > compile.log
      - name: Publish
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          AUTO: ${{ vars.AUTO_UPDATE != 'false' }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          COMPILES: ${{ steps.compile.outputs.ok }}
        run: |
          if [ "$AUTO" = "true" ] && [ "$CONFLICT" = "false" ] && [ "$COMPILES" = "true" ]; then
            git push origin "HEAD:$BASE"
            # Pushes made with the workflow token don't start other workflows; a dispatch does.
            gh workflow run build-deb.yml --ref "$BASE"
            echo "Pushed the update to $BASE and started the .deb build."
            exit 0
          fi
          git push --force origin upstream-sync
          {
            echo "New commits from the upstream apps, merged with the changes in this repository by scripts/update-upstream.sh."
            echo
            if [ "$CONFLICT" = "true" ]; then
              echo "**Merge conflicts:** upstream changed lines that were also changed here. The conflicted files are committed with conflict markers; check out this branch, resolve them, and push."
            elif [ "$COMPILES" = "true" ]; then
              echo "The suite compiles against the update. Merging builds and publishes the new .deb."
            else
              echo "**The suite does not compile against this update** (an upstream API it uses changed; see suite/src/hosts.rs). Last lines of \`cargo check\`:"
              echo; echo '```'; cat compile.log; echo '```'
            fi
          } > body.md
          if gh pr view upstream-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit upstream-sync --body-file body.md
          else
            gh pr create --base "$BASE" --head upstream-sync --title "Update from upstream apps" --body-file body.md
          fi
          # A pull request opened with the workflow token starts no workflows: start the build
          # on the branch, so the pull request shows whether the packages build (it publishes
          # nothing: only builds of the default branch make releases).
          if [ "$CONFLICT" = "false" ]; then
            gh workflow run build-deb.yml --ref upstream-sync
          fi
