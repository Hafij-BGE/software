[package]
name = "craft-suite"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Craft Suite: WordCraft, DeckCraft, GridCraft and Markd in one tabbed window"

# A workspace of its own: the apps under upstream/ stay members of their own workspaces (their
# `workspace = true` settings resolve there), and this crate only depends on their library crates.
[workspace]

[dependencies]
wordcraft-engine = { path = "../upstream/wordcraft/crates/engine" }
wordcraft-ui-egui = { path = "../upstream/wordcraft/crates/ui-egui" }
wordcraft-proof = { path = "../upstream/wordcraft/crates/proof" }
wordcraft-fonts = { path = "../upstream/wordcraft/crates/fonts" }
wordcraft-control-key = { path = "../upstream/wordcraft/crates/control-key" }
deckcraft-engine = { path = "../upstream/deckcraft/crates/engine" }
deckcraft-ui-egui = { path = "../upstream/deckcraft/crates/ui-egui" }
deckcraft-media = { path = "../upstream/deckcraft/crates/media" }
deckcraft-fonts = { path = "../upstream/deckcraft/crates/fonts" }
gridcraft-engine = { path = "../upstream/gridcraft/crates/engine" }
gridcraft-ui-egui = { path = "../upstream/gridcraft/crates/ui-egui" }

eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "links", "wayland", "x11"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# What the upstream apps' own binaries use for their services; the modules that use them are
# compiled straight from upstream/*/apps/*/src (see src/hosts.rs).
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
pollster = "0.4"
cpal = "0.16"
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "d27646a5f7c8b4fc85d9dd3213b8c88b58e0088d" }

# Ask AI (src/ai): HTTPS to the AI providers and the system keyring for their keys. Only with the
# `ai` feature (on by default); `--no-default-features` builds the suite without any of it.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
keyring-core = { version = "1", optional = true }

# Markd tabs (src/markd): the system's web view (WebKitGTK on Linux, WebView2 on Windows) showing
# Markd's web version. Only with the `markd` feature (on by default).
wry = { version = "0.57", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
wl-clipboard-rs = "0.9"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"], optional = true }
# Markd tabs: the versions wry 0.57 uses.
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"], optional = true }
x11-dl = { version = "2.21", optional = true }

# As WordCraft's Windows build: the system's animation setting and home region (WinRT), and the
# clipboard's Rich Text Format, read by the modules compiled from upstream/wordcraft.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["UI_ViewManagement", "System_UserProfile"] }
clipboard-win = { version = "5.4", features = ["std"] }
windows-native-keyring-store = { version = "1", optional = true }

[features]
default = ["ai", "markd"]
# Ask AI. To build without it: cargo build --no-default-features (or remove "ai" above).
ai = ["dep:keyring-core", "dep:zbus-secret-service-keyring-store", "dep:windows-native-keyring-store"]
# Markd tabs. Linux needs WebKitGTK 4.1 (libwebkit2gtk-4.1-dev to build). To build without them:
# cargo build --no-default-features --features ai.
markd = ["dep:wry", "dep:base64", "dep:gtk", "dep:gdkx11", "dep:webkit2gtk", "dep:x11-dl"]

[build-dependencies]
# Icon and version information for craft-suite.exe (build.rs; nothing on other systems).
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# As the upstream workspaces have it (craft-pdf requires it: the backend rejects writers that
# failed during unwinding). scripts/update-upstream.sh keeps it at upstream/wordcraft's revision.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
