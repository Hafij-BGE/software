[package]
name = "wordcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft fonts: font database (bundled OFL + system), metrics, glyph outlines, shaping"

[lints]
workspace = true

[dependencies]
# Linux packages map craft-fonts from /usr/share/craft-suite/fonts (CRAFT_FONTS_SHARED, see build.rs).
craft-font-files = { path = "../../../../crates/font-files" }
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
wuff = { workspace = true }
brotli-decompressor = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
log = { workspace = true }
